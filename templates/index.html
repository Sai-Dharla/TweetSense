<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TweetSense - Sentiment Analysis on Twitter Data</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-viewport">
        <!-- Top Navigation / Branding -->
        <header class="header">
            <div class="brand">
                <svg class="twitter-bird-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"/>
                </svg>
                <span class="brand-text">TweetSense</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-container">
            <div class="center-content">
                <!-- Heading Section -->
                <div class="heading-group">
                    <h1 class="main-title">Sentiment Analysis on Twitter Data</h1>
                    <p class="subtitle">
                        Enter a tweet and discover whether it’s <span class="tag-pos">Positive</span>, <span class="tag-neg">Negative</span>, or <span class="tag-neu">Neutral</span>.
                    </p>
                </div>

                <!-- Card / Workspace Area -->
                <div class="workspace-card">
                    <!-- Tweet Input Section -->
                    <div class="input-container">
                        <textarea 
                            id="tweetInput" 
                            class="tweet-textarea" 
                            maxlength="280" 
                            placeholder="Enter or paste a tweet here..."
                            rows="4"
                        ></textarea>
                        <div class="counter-container">
                            <span id="charCount" class="char-count">0/280</span>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <div class="action-container">
                        <button id="analyzeBtn" class="btn-analyze">
                            <span class="btn-text">Analyze Sentiment</span>
                            <span class="btn-spinner hidden" id="spinner"></span>
                        </button>
                    </div>

                    <!-- Result Box -->
                    <div id="resultBox" class="result-box">
                        <!-- Initial subtle icon before analysis -->
                        <div id="initialState" class="initial-state">
                            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                <path d="M8 10h.01"></path>
                                <path d="M12 10h.01"></path>
                                <path d="M16 10h.01"></path>
                            </svg>
                        </div>

                        <!-- Active Result View -->
                        <div id="resultContent" class="result-content hidden">
                            <div class="result-row">
                                <span class="result-label">Sentiment:</span>
                                <span id="sentimentValue" class="sentiment-badge">Positive</span>
                            </div>
                            <div class="result-row">
                                <span class="result-label">Compound Score:</span>
                                <span id="compoundValue" class="compound-score">0.0000</span>
                            </div>
                        </div>

                        <!-- Error View -->
                        <div id="errorContent" class="error-content hidden">
                            <p id="errorMessage" class="error-text"></p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
